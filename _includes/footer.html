<footer class="footer">
  <div class="wrap footer__inner">
    <div class="footer__col">
      <p class="footer__name">Humanities Innovation Lab</p>
      <p class="footer__addr">
        {{ site.address.street }}<br>
        {{ site.address.city }} {{ site.address.postal }}<br>
        {{ site.address.country }}
      </p>
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    </div>

    <div class="footer__col footer__col--links">
      <a href="{{ site.social.zenodo }}" target="_blank" rel="noopener">Zenodo Community</a>
      <a href="{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ site.social.twitter }}" target="_blank" rel="noopener">Twitter</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </div>

  <div class="footer__base">
    <div class="wrap">
      <p>&copy; {{ site.time | date: '%Y' }} by Humanities Innovation Lab.</p>
    </div>
  </div>
</footer>
