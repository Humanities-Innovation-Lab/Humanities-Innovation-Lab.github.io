{%- comment -%}
  The Wix footer was just three white social marks centred over a copyright
  line. (Its "Proudly created with Wix.com" is dropped, for obvious reasons.)
{%- endcomment -%}
<footer class="footer">
  <div class="wrap">
    <div class="footer__socials">
      <a href="{{ site.social.zenodo }}" target="_blank" rel="noopener" aria-label="Zenodo community" title="Zenodo community">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 5.5h8.7v2.1l-5.6 8.3h5.8v2.6H2.1v-2.1l5.6-8.3H2.5V5.5Zm10.9 0h2.9l2.6 4.6 2.6-4.6h2.9l-4.1 6.9 4.3 6.6h-3l-2.7-4.5-2.7 4.5h-3l4.3-6.6-4.1-6.9Z"/>
        </svg>
      </a>

      <a href="{{ site.social.github }}" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.55v-1.94c-3.2.7-3.88-1.54-3.88-1.54-.52-1.34-1.28-1.7-1.28-1.7-1.05-.71.08-.7.08-.7 1.16.09 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.25 5.69.41.36.78 1.06.78 2.14v3.17c0 .3.2.66.8.55A11.5 11.5 0 0 0 23.5 12A11.5 11.5 0 0 0 12 .5Z"/>
        </svg>
      </a>

      <a href="{{ site.social.twitter }}" target="_blank" rel="noopener" aria-label="X" title="X">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14.6 10.6 22 2h-2.1l-6.2 7.2L8.8 2H2.5l7.8 11.3L2 22h2.1l7.1-7.4L16.3 22h6.3l-8-11.4Zm-2.5 2.6-.8-1.1L5.1 3.6h2.7l5 7 .8 1.1 6.5 8.8h-2.7l-5.3-7.3Z"/>

  </div>
</footer>
