# Books, chapters, and articles produced in the lab, newest first.
#
# Compiled from the lab's Zenodo community (zenodo.org/communities/hil), taking
# only records typed as publications — articles and conference papers. The
# community's 37 presentations, 3 lessons, 2 posters, 2 datasets and 2 videos are
# not listed here. Two records were deliberately excluded:
#   * "The Digital Medievalist Project" (2004) — its own description says it is a
