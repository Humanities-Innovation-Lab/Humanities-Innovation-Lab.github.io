---
layout: default
---
<div class="page-header{% if page.header_image %} page-header--image{% endif %}"
     {% if page.header_image %}style="background-image:url('{{ page.header_image | relative_url }}')"{% endif %}>
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-header__sub">{{ page.subtitle }}</p>{% endif %}
  </div>
</div>

<section class="section">
  <div class="wrap">
    {{ content }}
  </div>
</section>
